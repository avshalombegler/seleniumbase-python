name: Performance Tests

on:
  workflow_dispatch:
    inputs:
      shape:
        description: 'Load test shape'
        type: choice
        options:
          - ramp
          - spike
        default: ramp
        required: true
      run_time:
        description: 'Max run time (safety cap — shape controls actual duration)'
        type: choice
        options:
          - 60s
          - 120s
          - 180s
        default: 60s
        required: true

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: performance/jsonplaceholder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-locust

      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[performance]"

      - name: Check target availability
        run: curl -sf https://jsonplaceholder.typicode.com/posts/1 > /dev/null

      - name: Run load test
        env:
          LOCUST_SHAPE: ${{ github.event.inputs.shape }}
        run: |
          locust -f locustfile.py \
            --headless \
            --run-time ${{ github.event.inputs.run_time }} \
            --csv=results

      - name: Check thresholds
        run: python check_thresholds.py

      - name: Upload CSV results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-results
          path: performance/jsonplaceholder/results_*.csv
          retention-days: 7
