[project]
name = "seleniumbase-python"
version = "0.1.0"
description = "Modern E2E testing framework for the-internet.herokuapp.com using SeleniumBase"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Avshalom Begler", email = "avshalom210@gmail.com"}
]


dependencies = [
    "allure-pytest>=2.15.0",
    "allure-python-commons>=2.15.0",
    "beautifulsoup4>=4.14.2",
    "colorama>=0.4.6",
    "filelock>=3.20.0",
    "parameterized>=0.9.0",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pytest>=8.4.2",
    "pytest-html>=4.0.2",
    "pytest-rerunfailures>=16.1",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.1.1",
    "python-json-logger>=4.0.0",
    "requests>=2.32.5",
    "seleniumbase>=4.44.20",
    "structlog>=25.5.0",
    "mcp>=1.0.0",
]


[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "ngrok>=1.7.0",
    "ruff>=0.5.0",
    "taskipy>=1.12.0",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
addopts = [
    # Log output:
        # show summary of all test results
        "-v",
        "-ra",
        # use short traceback format
        "--tb=short",
        # durations description
        # "--durations=0",
        # suppress warnings
        "--disable-warnings",
        # disable internal capturing of stdout and stderr
        # "--show-capture=no",
        # Disable pytest's built-in log capture so allure-pytest does not add a duplicate "log" section
        "-p no:logging",

    # Multi-threading:
    # "-nauto",
    # "--dist=loadfile",

    # Reporting:
    # "--dashboard",
    # "--html=report.html",
    # "--html=dashboard.html",
    # "--alluredir=reports/allure-results",

    # Markers:
    "-m regression",
    # "-m regression or smoke",
    # "-m smoke",
    # "-m ui",
    # "-m api",
    # "-m current",
    # enforce marker validation
    "--strict-markers",
    # Skip tests marked @pytest.mark.fix (healer marks these as needing human review)
    # Uncomment the line below to activate automatic skipping:
    # "-m not fix",

    # Chrome-Headless-Shell:
    # "--chs",

    # Code Coverage
    # "--cov=src/pages --cov-report=html",
]


markers = [
    "regression: full regression test suite",
    "smoke: critical tests",
    "ui: user interface interactions - auto-navigate to base url",
    "api: ",
    "fix: test needs human review (healer could not auto-resolve); add '-m not fix' to addopts to skip",
    # "flaky: tests that may fail intermittently",
    # "slow: tests that take more than 10 seconds",
]


filterwarnings = [
    "ignore::urllib3.exceptions.NotOpenSSLWarning",
    "ignore:Connection pool is full:Warning",
    "ignore::UserWarning:pytest_html",
]


# Main tests folder path:
testpaths = ["tests"]

# Project naming patterns:
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Rerun configurations:
# reruns = 3
# reruns_delay = 2

# Log printing to CLI with custom format for structlog
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(message)s"
log_format = "%(message)s"


[tool.ruff]
line-length = 120


[tool.ruff.lint]
select = ["E", "F", "I", "UP"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true


[[tool.mypy.overrides]]
module = "seleniumbase.*"
ignore_missing_imports = true


[[tool.mypy.overrides]]
module = "parameterized.*"
ignore_missing_imports = true


[tool.taskipy.tasks]
check = "ruff check ."
fix   = "ruff check . --fix && ruff format ."